name: Release

# Publishing is triggered by pushing a version tag (v1.2.3). The tag must match
# extension/manifest.json's version, and the whole test suite has to pass,
# before anything is sent to the store.
#
# Deliberately no third-party actions: everything here is `run:` steps against
# Google's REST APIs, so no external action can see the publish credentials.
# Even the two GitHub-authored actions used (checkout, setup-node) run in the
# `verify` job, which holds no credentials at all.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and validate the package without publishing'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Everything that can fail cheaply happens here, before any credential is
  # minted and before the store is contacted.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      digest: ${{ steps.digest.outputs.digest }}
    permissions:
      contents: read
      # Signs the build attestation that binds the package to this commit. This
      # is the *only* extra privilege here, and it grants nothing towards the
      # store: attestation identities are issued by Sigstore, and this job has
      # no path to Google. Attesting here rather than in `publish` keeps the
      # credential-bearing job free of any action that handles keys.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A tag that disagrees with the manifest means the release would ship a
      # version other than the one the tag names. The store versions releases
      # by the manifest, so the manifest is the source of truth and the tag has
      # to agree with it.
      - name: Check the tag matches the manifest version
        id: version
        run: |
          set -euo pipefail
          manifest_version="$(node -p 'require("./extension/manifest.json").version')"
          echo "version=$manifest_version" >> "$GITHUB_OUTPUT"
          echo "manifest.json declares $manifest_version"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$manifest_version" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest version $manifest_version."
              exit 1
            fi
            echo "Tag ${GITHUB_REF_NAME} matches."
          fi

      - name: Unit tests
        run: npm run test:unit

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chrome for Testing
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:browser

      # Build the package here too, so a packaging error surfaces before the
      # release job asks for credentials.
      - name: Build the store package
        run: npm run package

      # Record the digest of exactly what was built, so the attestation, the
      # artifact and the store upload can all be tied to one another by hash.
      - name: Record the package digest
        id: digest
        run: |
          set -euo pipefail
          zip="$(ls dist/*.zip)"
          digest="$(sha256sum "$zip" | cut -d' ' -f1)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "sha256($zip) = $digest"

      # Bind the package to this commit, cryptographically and publicly.
      #
      # This produces a Sigstore-signed statement — "commit <sha> of this
      # repository, built by this workflow run, produced a zip with this
      # digest" — recorded in a public transparency log. Anyone can check it
      # with `gh attestation verify`, and the signing identity is GitHub's OIDC
      # issuer, not a key this repository holds.
      #
      # This is the one third-party-shaped action in the release path. It is
      # GitHub's own, like checkout and setup-node, and it runs in this job,
      # which holds no store credentials. Hand-rolling it is not a real
      # alternative: the value comes from the signature chaining to GitHub's own
      # identity, which cannot be reproduced with `run:` steps.
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.zip

      - name: Upload the package for inspection
        uses: actions/upload-artifact@v4
        with:
          name: tab-reaper-${{ steps.version.outputs.version }}
          path: dist/*.zip
          retention-days: 90

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The `release` environment is the approval gate and the only place the
    # store identifiers live. Configure it with required reviewers so a tag
    # push waits for a human before anything is submitted.
    environment:
      name: release
      url: https://chrome.google.com/webstore/detail/${{ vars.CWS_ITEM_ID }}
    permissions:
      # Mints the OIDC token that Google exchanges for a short-lived access
      # token. This is the entire reason no long-lived key is stored anywhere.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Only Playwright is a dev dependency and publishing does not need it,
      # but `npm ci` keeps the lockfile authoritative and the tree identical to
      # the verified one.
      - run: npm ci

      # A manual dry run still authenticates and reads the item back. That
      # exercises the parts most likely to be misconfigured — the federation
      # binding, the dashboard's service-account link, the publisher and item
      # IDs — without submitting anything. Skipping the job entirely would
      # leave all of that untested until a real release.
      #
      # Rebuild rather than downloading the verify job's artifact: an artifact
      # is mutable by any later job, and the build is deterministic, so
      # rebuilding from the checked-out tag is both simpler and safer.
      # The attestation covers the digest `verify` built. This job rebuilds
      # rather than downloading that artifact (an artifact can be replaced by
      # any later job, and the build is deterministic), so the rebuild has to
      # land on the same digest — otherwise the thing published is not the thing
      # attested, and the provenance claim would be false.
      - name: Check the rebuild matches the attested package
        env:
          EXPECTED_DIGEST: ${{ needs.verify.outputs.digest }}
        run: |
          set -euo pipefail
          npm run package
          zip="$(ls dist/*.zip)"
          digest="$(sha256sum "$zip" | cut -d' ' -f1)"
          if [ "$digest" != "$EXPECTED_DIGEST" ]; then
            echo "::error::Rebuild digest $digest does not match the attested $EXPECTED_DIGEST."
            echo "The package is meant to be byte-reproducible; publishing would break provenance."
            exit 1
          fi
          echo "Rebuild matches the attested digest ($digest)."

      - name: Publish to the Chrome Web Store
        env:
          # Non-secret identifiers, kept as environment variables so they are
          # visible in logs for debugging.
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ vars.CWS_ITEM_ID }}
          CWS_SERVICE_ACCOUNT: ${{ vars.CWS_SERVICE_ACCOUNT }}
          CWS_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
          # Cross-check inside the script as well, so a manual run cannot
          # publish a version the tag does not name.
          CWS_EXPECT_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/publish.js --check-auth
          else
            npm run publish:store
          fi
