name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # Unit tests need no browser, so run them first — they fail fast and
      # cheaply if the reaping logic is wrong.
      - name: Unit tests
        run: npm run test:unit

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # --with-deps installs the system libraries headless Chrome needs on a
      # bare runner. When the browser itself is cached, only those are missing.
      - name: Install Chrome for Testing
        run: npx playwright install --with-deps chromium

      # Chrome's headless mode supports MV3 extensions, so no virtual display
      # is needed — verified locally that the service worker starts headless.
      - name: Browser tests
        run: npm run test:browser

      # Note: there is deliberately no "icons are up to date" check. PNG
      # rasterization is not guaranteed byte-identical across platforms, and
      # this runner is Linux while the committed icons were generated on macOS,
      # so a byte comparison would fail on healthy commits. options.spec.js
      # already asserts every icon the manifest declares actually loads.

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
