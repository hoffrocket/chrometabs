name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Unit tests need no browser, so run them first — they fail fast and
      # cheaply if the reaping logic is wrong.
      - name: Unit tests
        run: npm run test:unit

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # --with-deps installs the system libraries headless Chrome needs on a
      # bare runner. When the browser itself is cached, only those are missing.
      - name: Install Chrome for Testing
        run: npx playwright install --with-deps chromium

      # Chrome's headless mode supports MV3 extensions, so no virtual display
      # is needed — verified locally that the service worker starts headless.
      - name: Browser tests
        run: npm run test:browser

      # Note: there is deliberately no "icons are up to date" check. PNG
      # rasterization is not guaranteed byte-identical across platforms, and
      # this runner is Linux while the committed icons were generated on macOS,
      # so a byte comparison would fail on healthy commits. options.spec.js
      # already asserts every icon the manifest declares actually loads.

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
